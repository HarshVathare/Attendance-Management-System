version: "3.8"

services:

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Harsh@9595
      MYSQL_DATABASE: StudentDB
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    image: docker-demo:4.0
    container_name: springboot-app
    depends_on:
      - mysql
    restart: always
    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/StudentDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Harsh@9595

    volumes:
      - name-vol:/app


volumes:
  mysql-data:
  name-vol: